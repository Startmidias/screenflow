# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Se as TVs ficarem desligadas e ninguém abrir o painel, esta consulta diária
# (leve, só leitura) mantém o banco acordado.
name: Manter o Supabase ativo
on:
  schedule:
    - cron: "17 11 * * *"   # todo dia, 07:17 em Cuiabá
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false
      - name: Consulta ao banco
        run: |
          URL=$(grep -o 'supabaseUrl: *"[^"]*"' config.js | cut -d'"' -f2)
          KEY=$(grep -o 'supabaseKey: *"[^"]*"' config.js | cut -d'"' -f2)
          for i in 1 2 3; do
            if curl -fsS --max-time 30 -X POST "$URL/rest/v1/rpc/sf_has_admin" \
                 -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'; then
              echo; echo "banco respondeu"; exit 0
            fi
            sleep 20
          done
          echo "::error::O Supabase não respondeu. Abra o painel do Supabase e veja se o projeto está pausado."
          exit 1
