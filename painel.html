<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1014">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22%3E%3Cstop offset=%220%22 stop-color=%22%23FC0491%22/%3E%3Cstop offset=%221%22 stop-color=%22%231D02A9%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22url(%23g)%22/%3E%3Cpath d=%22M12 9v14l11-7z%22 fill=%22white%22/%3E%3C/svg%3E">
<title>START PLAY · Painel</title>
<style>
  :root{
    --bg:#F5F6F8; --card:#FFFFFF; --line:#E4E6EB; --text:#14161B; --muted:#646B78;
    --acc:#B3108F; --acc-soft:#FCE8F4; --grad:linear-gradient(90deg,#E6037F,#4A03B0); --ok:#1F8F3A; --ok-soft:#E6F4EA; --warn:#A8620B; --warn-soft:#FBF0E1;
    --err:#C22F2F; --err-soft:#FBEAEA; --gray-soft:#EEF0F3; --r:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  a{color:var(--acc)}
  .hide{display:none!important}
  .num{font-variant-numeric:tabular-nums}

  /* topo */
  .top{position:sticky;top:0;z-index:5;background:#0E1014;color:#fff}
  .top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;height:56px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
  .brand .lg{height:24px;width:auto;display:block}
  .brand .tag-p{font-size:11px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);padding:2px 8px;border-radius:999px;letter-spacing:.06em}
  .tabs{display:flex;gap:2px;margin-left:6px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 11px;border-radius:8px;color:#C5CAD3;font-weight:500;white-space:nowrap}
  .tab.on{background:#232838;color:#fff}
  .spacer{flex:1}
  .who{color:#9AA1AD;font-size:13px;white-space:nowrap}
  .link-btn{color:#C5CAD3;font-size:13px;padding:6px 8px;border-radius:6px}
  .link-btn:hover{background:#232838}

  main{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
  .head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
  h2.sec{font-size:15px;font-weight:700;margin:26px 0 10px}
  .sub{color:var(--muted);font-size:14px}
  .small{font-size:12.5px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;background:var(--acc);background:var(--grad);color:#fff;white-space:nowrap}
  .btn svg{width:16px;height:16px;flex-shrink:0}
  .btn:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:var(--card);background-image:none;color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:var(--err);background-image:none}
  .btn.sm{height:34px;padding:0 12px;font-size:14px}
  .btn:focus-visible,.icon:focus-visible,.tab:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--gray-soft);color:var(--muted);white-space:nowrap}
  .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
  .chip.err{background:var(--err-soft);color:var(--err)} .chip.acc{background:var(--acc-soft);color:var(--acc)}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
  .pad{padding:14px 16px}
  .list{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:14px;padding:12px}
  .thumb{width:112px;height:63px;border-radius:8px;background:#0E1014;flex-shrink:0;overflow:hidden;position:relative}
  .thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .kind{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px}
  .info{flex:1;min-width:0}
  .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t2{color:var(--muted);font-size:13px;margin-top:2px}
  .t2.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acts{display:flex;gap:2px;flex-shrink:0;align-items:center}
  .icon{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
  .icon:hover{background:var(--gray-soft);color:var(--text)}
  .icon:disabled{opacity:.3;cursor:default;background:none}
  .icon svg{width:18px;height:18px}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
  .warn-txt{color:var(--warn)} .err-txt{color:var(--err)} .ok-txt{color:var(--ok)}

  .empty{text-align:center;padding:40px 16px;color:var(--muted)}
  .empty h3{color:var(--text);font-size:17px;margin-bottom:6px}
  .empty .btn{margin-top:16px}

  /* indicadores */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
  .kpi{padding:14px 16px}
  .kpi .k{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .kpi .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
  .kpi .d{font-size:12.5px;color:var(--muted);margin-top:2px}
  .kpi.alert{border-color:#F0C9C9;background:#FFF8F8}
  .grid2c{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
  .bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
  .bars .b{flex:1;background:var(--grad);border-radius:4px 4px 0 0;min-height:2px;position:relative}
  .bars .b span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
  .alerts .al{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}
  .alerts .al:last-child{border-bottom:0}
  .alerts .al b{display:block;font-size:14px}
  .meter{height:8px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin-top:6px}
  .meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
  .meter.warn i{background:#E5A33A} .meter.err i{background:var(--err)}

  /* formulário */
  .field{margin-bottom:14px}
  .field label,.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .in{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff}
  textarea.in{height:auto;padding:10px 12px;resize:vertical}
  .in:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .drop{border:1.5px dashed #C9CDD5;border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:#FAFBFC}
  .drop.has{border-style:solid;border-color:var(--line);text-align:left}
  .drop strong{color:var(--text)}
  .preview{display:flex;gap:12px;align-items:center}
  .checks{display:flex;flex-wrap:wrap;gap:8px}
  .check{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;background:#fff;user-select:none}
  .check input{accent-color:var(--acc)}
  .check.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
  .check.off{opacity:.45;cursor:not-allowed}
  .days{display:flex;gap:6px;flex-wrap:wrap}
  .days button{width:44px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px}
  .days button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px;user-select:none}
  .switch input{display:none}
  .switch .sl{display:inline-block;width:40px;height:23px;border-radius:99px;background:#CDD1D8;position:relative;flex-shrink:0;transition:background .15s}
  .field label.switch{display:flex;margin-bottom:0}
  .switch .sl:after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s}
  .switch input:checked+.sl{background:var(--acc)}
  .switch input:checked+.sl:after{left:20px}
  .box{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;background:#fff}
  .box h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .err-box{background:var(--err-soft);color:var(--err);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
  .ok-box{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px}
  .pbar{height:6px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden;margin-top:6px}
  .pbar i{display:block;height:100%;background:var(--grad);transition:width .3s}
  .pbar.warn i{background:var(--warn)}
  .bklist{max-height:220px;overflow:auto}
  .bklist .bk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
  .info-box{background:var(--acc-soft);color:var(--acc);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px}
  .warn-box{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px}
  .seg{display:inline-flex;background:var(--gray-soft);border-radius:10px;padding:3px;gap:2px}
  .seg button{padding:6px 12px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  input[type=range]{accent-color:var(--acc);width:100%}

  /* janela */
  .modal-bg{position:fixed;inset:0;background:rgba(14,16,20,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:32px 12px;overflow-y:auto}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:20px 20px 16px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
  .modal.wide{max-width:1080px}
  .modal.mid{max-width:760px}
  .modal h2{font-size:18px;margin-bottom:16px}
  .modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
  .cols{display:grid;grid-template-columns:1fr 420px;gap:20px;align-items:start}
  .sticky{position:sticky;top:0}

  /* prévia da TV */
  .tvwrap{background:#0E1014;border-radius:12px;padding:10px;display:flex;justify-content:center}
  .tvbox{position:relative;overflow:hidden;border-radius:6px;background:#000}
  .tvbox iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none}
  .tvprev{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin-top:10px}
  .tvprev.v{aspect-ratio:9/16;max-width:240px;margin-left:auto;margin-right:auto}
  .tvprev .area{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden}
  .tvprev .area.b{bottom:7.2%}
  .tvprev.v .area.b{bottom:4.06%}
  .tvprev .bd{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(18px) brightness(.55)}
  .tvprev img,.tvprev video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
  .tvprev .lbl{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:999px;letter-spacing:.03em;z-index:3}
  .tvprev .mock{position:absolute;left:0;right:0;bottom:0;height:7.2%;background:#07070C;display:flex;align-items:center;font-size:10px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;z-index:2}
  .tvprev.v .mock{height:4.06%}
  .tvprev .mock b{background:var(--grad);height:100%;display:flex;align-items:center;padding:0 8px;font-size:9px;letter-spacing:.06em}
  .tvprev .mock span{padding:0 8px;color:#fff}
  .tvprev .mock em{font-style:normal;color:#FFD23F;font-weight:800}

  /* criador de artes */
  .tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .tpls button{border:2px solid var(--line);border-radius:10px;background:#fff;padding:6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .tpls button.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
  .tpls canvas{width:100%;aspect-ratio:16/9;border-radius:6px;display:block;margin-bottom:4px}
  .tpls b{font-size:13px}
  .tpls span{font-size:11px;color:var(--muted);line-height:1.3}
  .pals{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pals button{width:40px;height:40px;border-radius:10px;border:2px solid transparent;cursor:pointer;position:relative;padding:0}
  .pals button i{position:absolute;right:4px;bottom:4px;width:12px;height:12px;border-radius:50%;border:2px solid #fff}
  .pals button.on{border-color:#111;box-shadow:0 0 0 3px var(--acc-soft)}
  .pcustom{display:flex;gap:2px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:3px}
  .pcustom input{width:30px;height:32px;border:0;padding:0;background:none;cursor:pointer}
  .artprev{background:#0E1014;border-radius:12px;padding:10px;display:flex;justify-content:center}
  .artprev canvas{max-width:100%;max-height:70vh;width:auto;height:auto;border-radius:6px;display:block}

  /* "ver a tela agora" */
  .row .shot{margin-right:4px}
  .shot{position:relative;flex-shrink:0;width:176px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0E1014;border:1px solid var(--line);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .shot.sm{width:112px}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot.none span{color:#9aa0ad;font-size:11px;padding:0 8px;text-align:center;line-height:1.3}
  .shot .age{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px}
  .shot .age.old{background:rgba(180,83,9,.85)}
  .shot:hover{outline:2px solid var(--acc)}
  .shotbig{background:#0E1014;border-radius:12px;overflow:hidden;display:flex;justify-content:center}
  .shotbig img{width:100%;height:auto;display:block}
  .shotbig.v img{width:auto;max-height:60vh}
  .shotstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .shotstrip button{flex-shrink:0;width:104px;border:2px solid transparent;border-radius:8px;padding:0;background:#0E1014;cursor:pointer;position:relative;overflow:hidden}
  .shotstrip button.on{border-color:var(--acc)}
  .shotstrip img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
  .shotstrip span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:0 5px;border-radius:99px}
  @media (max-width:640px){ .row .shot{width:100%;margin:0 0 8px} }

  /* tabelas */
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
  td.num,th.num{text-align:right;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  tr.tot td{font-weight:700;background:#FAFBFC}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .filters .in{width:auto;min-width:150px;height:38px}
  .timeline .ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .timeline .ev:last-child{border-bottom:0}
  .timeline .when{color:var(--muted);white-space:nowrap;min-width:118px}
  .banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;margin-bottom:14px;background:var(--warn-soft);border-color:#F1D9B5}
  .banner b{color:var(--warn)}
  .unit-h{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
  .code-big{font-size:20px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
  .pill{display:inline-block;background:var(--acc-soft);color:var(--acc);padding:2px 8px;border-radius:6px;font-weight:600;font-size:13px;word-break:break-all}

  /* login */
  .auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;background:linear-gradient(90deg,#FC0491,#1D02A9)}
  .auth-logo{width:260px;max-width:70vw;height:auto;display:block}
  .auth .modal{max-width:400px;padding:28px}
  .auth .ttl{font-weight:800;letter-spacing:.06em;font-size:15px;margin-bottom:14px}
  .auth p{color:var(--muted);font-size:14px;margin-bottom:16px}
  .auth .btn{width:100%;margin-top:4px}
  .auth .alt{text-align:center;margin-top:14px;font-size:14px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14161B;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;display:flex;gap:12px;align-items:center}
  .toast button{color:#FF7AC6;font-weight:700}
  .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
  .spin.dark{border-color:#D5D8DE;border-top-color:var(--acc)}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:900px){
    .cols,.grid2c{grid-template-columns:1fr}
    .sticky{position:static}
  }
  @media (max-width:640px){
    .top-in{gap:8px;padding:0 10px}
    .brand .tag-p,.who{display:none}
    .row{flex-wrap:wrap}
    .thumb{width:96px;height:54px}
    .acts{width:100%;justify-content:flex-end;border-top:1px solid var(--line);padding-top:6px}
    .grid2,.grid3{grid-template-columns:1fr}
    .hide-sm{display:none}
    .kpi .v{font-size:20px}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
  <symbol id="edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="eye" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g></symbol>
