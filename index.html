<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Start Play · Player</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:calc(100vh / 36)}
  html,body{height:100%;overflow:hidden;background:#000;color:#fff;cursor:none;
    font-family:Roboto,"Noto Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .layer{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;overflow:hidden;
    -webkit-transition:opacity .6s ease;transition:opacity .6s ease;background:#000}
  .layer.on{opacity:1}
  .layer .bd{position:absolute;left:-6%;top:-6%;width:112%;height:112%;background-size:cover;background-position:center;
    -webkit-filter:blur(2.2rem) brightness(.55);filter:blur(2.2rem) brightness(.55)}
  .layer img,.layer video,.layer canvas{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;display:block}
  .layer video{background:#000}
  #msg{position:absolute;left:0;top:0;width:100%;height:100%;display:none;
    background:#FC0491;background:-webkit-linear-gradient(left,#FC0491,#1D02A9);background:linear-gradient(90deg,#FC0491,#1D02A9)}
  #msg.on{display:block}
  .box{position:absolute;left:6rem;right:6rem;top:50%;-webkit-transform:translateY(-50%);transform:translateY(-50%)}
  .logo img{height:3.2rem;width:auto;display:block;margin-bottom:2.4rem}
  h1{font-size:2.6rem;font-weight:700;line-height:1.15}
  p{color:rgba(255,255,255,.85);font-size:1.2rem;line-height:1.45;margin-top:.8rem;max-width:44rem}
  .code{display:inline-block;margin-top:2rem;padding:.7rem 1.2rem;border-radius:.7rem;background:rgba(0,0,0,.28);
    border:1px solid rgba(255,255,255,.18);font-size:1.05rem;color:#fff}
  .code b{letter-spacing:.08em}
  #net{position:absolute;right:1.2rem;bottom:1rem;font-size:.75rem;color:#fff;background:rgba(0,0,0,.55);padding:.3rem .7rem;border-radius:1rem;display:none;z-index:5}
  #net.on{display:block}
  #ident{position:absolute;left:0;top:0;width:100%;height:100%;display:none;z-index:9;text-align:center;
    background:rgba(10,4,30,.82)}
  #ident.on{display:block}
  #ident .box{text-align:center}
  #ident .big{font-size:5rem;font-weight:800;letter-spacing:.06em;margin-top:1rem}
</style>
</head>
<body>
<div class="layer" id="L0"></div>
<div class="layer" id="L1"></div>
<div id="msg">
  <div class="box">
    <div class="logo"><img src="logo.png" alt="Start Play"></div>
    <h1 id="msg-t">Conectando…</h1>
    <p id="msg-p"></p>
    <div class="code" id="msg-c" style="display:none"></div>
  </div>
</div>
<div id="ident"><div class="box"><h1 id="ident-n"></h1><div class="big" id="ident-c"></div><p style="margin:1rem auto 0">Esta é a tela que você está identificando no painel.</p></div></div>
<div id="net">sem internet · passando o que já foi baixado</div>

<script src="config.js"></script>
<script>
(function(){
  "use strict";
  var VERSION = "2.2.0";
  var CFG = window.SCREENFLOW || {};
  var SYNC_MS = 60000;
  var IMG_TIMEOUT = 25000;
  var MAX_PIXELS = 16000000; // acima disso a TV Box pode travar
  var S = { id:null, name:"", items:[], idx:-1, layer:0, timer:null, cur:null, started:0, online:true,
            muted:false, applied:false, skips:0, ok:0, err:0, lastErr:"", lastErrAt:null, boot:Date.now(), token:0 };

  function $(id){ return document.getElementById(id) }
  function ls(k, v){ try { if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v) } catch(e){ return null } }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c] }) }
  function two(n){ return (n < 10 ? "0" : "") + n }
  function today(){ var d = new Date(); return d.getFullYear() + "-" + two(d.getMonth()+1) + "-" + two(d.getDate()) }

  // identidade fixa desta TV
  S.id = ls("sf_screen");
  if(!S.id){
    var c = "abcdefghjkmnpqrstuvwxyz23456789", r = "tv-";
    for(var i = 0; i < 12; i++) r += c.charAt(Math.floor(Math.random() * c.length));
    S.id = r; ls("sf_screen", r);
  }
  var CODE = S.id.slice(-6).toUpperCase();
  // conta quantas vezes o player abriu (ajuda a descobrir travamentos)
  var boots = (parseInt(ls("sf_boots") || "0", 10) || 0) + 1; ls("sf_boots", String(boots));

  function msg(t, p, showCode){
    $("msg-t").textContent = t; $("msg-p").textContent = p || "";
    $("msg-c").style.display = showCode ? "inline-block" : "none";
    $("msg-c").innerHTML = 'Esta tela: <b>' + esc(S.name || "Nova tela") + '</b> · código <b>' + CODE + '</b>';
    $("msg").className = "on";
  }
  function hideMsg(){ $("msg").className = "" }
  function fail(what, item){
    S.err++; S.lastErr = what + (item ? ": " + item.title : ""); S.lastErrAt = new Date().toISOString();
    if(window.console) console.log("[player] " + S.lastErr);
  }

  function rpc(fn, body){
    var h = { "apikey":CFG.supabaseKey, "Content-Type":"application/json" };
    if(/^eyJ/.test(CFG.supabaseKey)) h.Authorization = "Bearer " + CFG.supabaseKey;
    return fetch(CFG.supabaseUrl.replace(/\/$/, "") + "/rest/v1/rpc/" + fn, { method:"POST", headers:h, body:JSON.stringify(body) })
      .then(function(r){
        if(!r.ok) return r.text().then(function(t){ throw new Error(r.status + " " + t) });
        return r.status === 204 ? null : r.json();
      });
  }

  function deviceInfo(){
    var info = { ua:navigator.userAgent.slice(0, 200), w:screen.width, h:screen.height, dpr:window.devicePixelRatio || 1 };
    try { if(window.TV && TV.info){ var t = JSON.parse(TV.info()); info.model = t.model; info.android = t.android; info.ip = t.ip } } catch(e){}
    return info;
  }
  function status(){
    var st = { v:VERSION, boots:boots, up:Math.round((Date.now() - S.boot) / 1000), n:S.items.length,
               now:S.cur ? S.cur.title : null, ok:S.ok, err:S.err, online:S.online,
               vw:window.innerWidth, vh:window.innerHeight };
    if(S.lastErr){ st.lastErr = S.lastErr.slice(0, 240); st.lastErrAt = S.lastErrAt }
    if(S.fallback) st.fallback = S.fallback;
    if(performance && performance.memory) st.memMB = Math.round(performance.memory.usedJSHeapSize / 1048576);
    return st;
  }

  // ---------- sincronização ----------
  function sync(first){
    if(!CFG.supabaseUrl || CFG.supabaseUrl.indexOf("COLE_") === 0){
      msg("Falta configurar o site", "Preencha o arquivo config.js com os dados do Supabase."); return;
    }
    rpc("sf_sync", { p_screen:S.id, p_today:today(), p_info: first ? deviceInfo() : {}, p_status:status() })
      .then(function(d){
        S.online = true; $("net").className = "";
        S.name = (d && d.screen && d.screen.name) || "";
        if(d && d.command) command(d.command);
        var items = (d && d.items) || [];
        ls("sf_last", JSON.stringify({ name:S.name, items:items }));
        apply(items);
      })
      ["catch"](function(e){
        S.online = false;
        if(window.console) console.log("sync falhou", e);
        if(!S.items.length){
          var last = null; try { last = JSON.parse(ls("sf_last") || "null") } catch(x){}
          if(last && last.items && last.items.length){ S.name = last.name; apply(last.items) }
          else msg("Sem conexão com o servidor", "Confira a internet desta TV. Vou tentar de novo em 1 minuto.", true);
        }
        if(S.items.length) $("net").className = "on";
      });
  }

  function command(c){
    if(c === "reload"){ setTimeout(function(){ location.reload() }, 300) }
    else if(c === "identify"){
      $("ident-n").textContent = S.name || "Nova tela"; $("ident-c").textContent = CODE;
      $("ident").className = "on";
      setTimeout(function(){ $("ident").className = "" }, 15000);
    }
  }

  // procura versão nova do player a cada 5 minutos e recarrega sozinho
  function checkVersion(){
    fetch("version.txt?t=" + Date.now(), { cache:"no-store" })
      .then(function(r){ return r.ok ? r.text() : "" })
      .then(function(v){ v = (v || "").replace(/\s+/g, ""); if(v && v !== VERSION) location.reload() })
      ["catch"](function(){});
  }

  function sameList(a, b){
    if(a.length !== b.length) return false;
    for(var i = 0; i < a.length; i++) if(a[i].id !== b[i].id || a[i].url !== b[i].url || a[i].duration !== b[i].duration) return false;
    return true;
  }
  function apply(items){
    if(S.applied && sameList(items, S.items)) return;
    S.applied = true;
    var keep = {}; for(var k = 0; k < items.length; k++) keep[items[k].url] = 1;
    for(var u in blobCache) if(!keep[u]){ URL.revokeObjectURL(blobCache[u]); delete blobCache[u] }
    var wasEmpty = !S.items.length;
    S.items = items;
    if(!items.length){
      stop();
      msg("Tela pronta", "Nenhum anúncio no ar para esta tela agora. Cadastre no painel e ele aparece aqui em até 1 minuto.", true);
      return;
    }
    if(wasEmpty || !S.cur) next();
    // se a lista mudou, a troca acontece no fim do anúncio atual
  }

  // ---------- reprodução ----------
  function stop(){
    clearTimeout(S.timer); S.timer = null; S.cur = null; S.token++;
    for(var i = 0; i < 2; i++){ var L = $("L" + i); L.className = "layer"; L.innerHTML = "" }
  }

  function finish(){
    if(S.cur){
      var secs = Math.round((Date.now() - S.started) / 1000);
      if(secs >= 2){ S.ok++; rpc("sf_log", { p_screen:S.id, p_media:S.cur.id, p_seconds:secs })["catch"](function(){}) }
    }
    next();
  }

  function next(){
    clearTimeout(S.timer);
    if(!S.items.length){ stop(); return }
    var token = ++S.token;               // ignora respostas de anúncios antigos
    S.idx = (S.idx + 1) % S.items.length;
    var item = S.items[S.idx];
    var L = $("L" + (1 - S.layer));
    var old = $("L" + S.layer);

    function alive(){ return token === S.token }
    function show(){
      if(!alive()) return;
      hideMsg();
      L.className = "layer on"; old.className = "layer";
      S.layer = 1 - S.layer; S.cur = item; S.started = Date.now(); S.skips = 0;
      setTimeout(function(){ if(old.className === "layer") old.innerHTML = "" }, 900);
      preloadNext();
    }
    function skip(why){
      if(!alive()) return;
      fail(why, item);
      L.innerHTML = "";
      if(S.cur === item) S.cur = null;
      if(++S.skips >= S.items.length){
        S.skips = 0;
        msg("Não consegui abrir os anúncios",
            S.online ? "Os arquivos não carregaram nesta TV. Vou tentar de novo em 20 segundos." : "Sem internet e nada salvo ainda nesta TV.", true);
        S.cur = null;
        S.timer = setTimeout(next, 20000); return;
      }
      S.timer = setTimeout(next, 300);
    }

    L.innerHTML = "";
    if(item.kind === "video"){
      var v = document.createElement("video");
      v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", "");
      v.preload = "auto"; v.muted = S.muted; v.src = item.url;
      L.appendChild(v);   // carrega na camada escondida e só aparece quando começa a tocar
      var started = false, lastT = -1, stuck = 0;
      v.addEventListener("playing", function(){
        if(started || !alive()) return;
        started = true; show();
        clearTimeout(S.timer);
        var max = (isFinite(v.duration) && v.duration > 0 ? v.duration + 5 : 600) * 1000;
        S.timer = setTimeout(function(){ if(alive()) finish() }, Math.min(max, 600000));
        // vigia: se o vídeo travar por 15 s, passa para o próximo
        var guard = setInterval(function(){
          if(!alive()){ clearInterval(guard); return }
          if(v.currentTime === lastT){ if(++stuck >= 3){ clearInterval(guard); fail("vídeo travou", item); finish() } }
          else { stuck = 0; lastT = v.currentTime }
        }, 5000);
      });
      v.addEventListener("ended", function(){ if(alive() && started) finish() });
      v.addEventListener("error", function(){ if(!alive()) return; if(!started) skip("vídeo não abriu"); else finish() });
      var p = v.play();
      if(p && p["catch"]) p["catch"](function(){
        if(!alive()) return;
        // navegador comum bloqueia vídeo com som: tenta sem som
        if(!v.muted){ v.muted = true; S.muted = true; var p2 = v.play(); if(p2 && p2["catch"]) p2["catch"](function(){ skip("vídeo não tocou") }) }
        else skip("vídeo não tocou");
      });
      S.timer = setTimeout(function(){ if(!started) skip("vídeo demorou demais para abrir") }, 25000);
    } else {
      var img = new Image();
      img.decoding = "async";
      var done = false;
      function showImage(el, w, h, bdUrl){
        if(!w || !h){ skip("imagem vazia"); return }
        if(w * h > MAX_PIXELS){ skip("imagem grande demais (" + w + "x" + h + ")"); return }
        // foto em pé ou de outro formato: fundo desfocado com a própria foto
        var screenRatio = window.innerWidth / Math.max(1, window.innerHeight), ratio = w / h;
        if(bdUrl && Math.abs(ratio - screenRatio) / screenRatio > 0.12){
          var bd = document.createElement("div"); bd.className = "bd";
          bd.style.backgroundImage = "url(\"" + bdUrl.replace(/"/g, "%22") + "\")";
          L.appendChild(bd);
        }
        L.appendChild(el);
        show();
        S.timer = setTimeout(function(){ if(alive()) finish() }, Math.max(3, item.duration || 10) * 1000);
      }
      img.onload = function(){
        if(done || !alive()) return; done = true;
        showImage(img, img.naturalWidth, img.naturalHeight, item.url);
      };
      img.onerror = function(){
        if(done || !alive()) return; done = true;
        loadViaBlob(item, function(e, el, how){
          if(!alive()) return;
          if(e){ skip("imagem não abriu: " + e.message); return }
          S.fallback = how;                      // registra que precisou do plano B
          showImage(el, el.naturalWidth || el.width, el.naturalHeight || el.height, el.src || null);
        });
      };
      S.timer = setTimeout(function(){ if(!done){ done = true; img.src = ""; skip("imagem demorou demais para abrir") } }, IMG_TIMEOUT);
      img.src = item.url;
    }
  }

  // Plano B para imagens que o <img> não abre nesta TV Box:
  // baixa o arquivo, tenta abrir de novo e, se precisar, decodifica num canvas.
  var blobCache = {};   // url -> endereço local (evita baixar de novo e não acumula memória)
  function loadViaBlob(item, cb){
    var ct = "";
    var cached = blobCache[item.url];
    if(cached){
      var ci = new Image();
      ci.onload = function(){ cb(null, ci, "blob") };
      ci.onerror = function(){ delete blobCache[item.url]; URL.revokeObjectURL(cached); loadViaBlob(item, cb) };
      ci.src = cached; return;
    }
    fetch(item.url, { cache:"no-store" })
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); ct = r.headers.get("content-type") || ""; return r.blob() })
      .then(function(b){
        var u = URL.createObjectURL(b), im = new Image();
        im.onload = function(){ blobCache[item.url] = u; cb(null, im, "blob") };
        im.onerror = function(){
          URL.revokeObjectURL(u);
          if(!window.createImageBitmap){ viaJs(b, "sem createImageBitmap"); return }
          createImageBitmap(b).then(function(bmp){
            var c = document.createElement("canvas"); c.width = bmp.width; c.height = bmp.height;
            c.getContext("2d").drawImage(bmp, 0, 0); if(bmp.close) bmp.close();
            c.naturalWidth = c.width; c.naturalHeight = c.height;
            cb(null, c, "canvas");
          })["catch"](function(e){ viaJs(b, e && (e.name || e.message)) });
        };
        // Plano C: este TV Box não abre JPEG de jeito nenhum (nem <img>, nem
        // createImageBitmap). O próprio player decodifica o arquivo e desenha
        // num canvas; depois guarda uma cópia em PNG, que a TV abre normalmente.
        function viaJs(blob, why){
          jsDecode(blob).then(function(cv){
            cv.naturalWidth = cv.width; cv.naturalHeight = cv.height;
            cb(null, cv, "js");
            if(cv.toBlob) cv.toBlob(function(png){
              if(png && !blobCache[item.url]) blobCache[item.url] = URL.createObjectURL(png);
            }, "image/png");
          })["catch"](function(e){
            cb(new Error("não decodifica (" + ct + ", " + blob.size + " bytes): " + why + "; " + (e && e.message)));
          });
        }
        im.src = u;
      })
      ["catch"](function(e){ cb(new Error("download falhou: " + (e && e.message))) });
  }

  var jpegLib = null;
  function jsDecode(blob){
    jpegLib = jpegLib || new Promise(function(res, rej){
      var sc = document.createElement("script"); sc.src = "jpeg-decoder.js?v=" + VERSION; sc.onload = res;
      sc.onerror = function(){ jpegLib = null; rej(new Error("decodificador indisponível")) };
      document.head.appendChild(sc);
    });
    return jpegLib.then(function(){ return new Response(blob).arrayBuffer() }).then(function(buf){
      var b = new Uint8Array(buf);
      if(b[0] !== 0xFF || b[1] !== 0xD8) throw new Error("não é JPEG");
      var im = window["jpeg-js"].decode(b, { useTArray:true, formatAsRGBA:true, maxResolutionInMP:16, maxMemoryUsageInMB:200 });
      if(im.width * im.height > MAX_PIXELS) throw new Error("imagem grande demais (" + im.width + "x" + im.height + ")");
      var cv = document.createElement("canvas"); cv.width = im.width; cv.height = im.height;
      var g = cv.getContext("2d"), d = g.createImageData(im.width, im.height);
      d.data.set(im.data); g.putImageData(d, 0, 0);
      return cv;
    });
  }

  function preloadNext(){
    if(S.items.length < 2) return;
    var n = S.items[(S.idx + 1) % S.items.length];
    if(n.kind === "image"){ var i = new Image(); i.src = n.url }
  }

  // ---------- início ----------
  msg("Conectando…", "", false);
  try { var last = JSON.parse(ls("sf_last") || "null"); if(last && last.items){ S.name = last.name } } catch(e){}
  sync(true);
  setInterval(function(){ sync(false) }, SYNC_MS);
  setInterval(checkVersion, 5 * 60000);
  // recarrega a página uma vez por dia de madrugada (libera memória)
  setInterval(function(){ var d = new Date(); if(d.getHours() === 4 && d.getMinutes() < 2 && Date.now() - S.boot > 3600000) location.reload() }, 60000);
  window.ScreenFlowPlayer = { state:S, sync:sync, next:next, version:VERSION };
})();
</script>
</body>
</html>
